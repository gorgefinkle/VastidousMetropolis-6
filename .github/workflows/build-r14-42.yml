name: R14.49 Terrain Hydrology Networks

on:
  push:
    branches:
      - feature/r14-42-missile-silo-complex
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/r14-42-missile-silo-complex' || github.ref_name == 'feature/r14-42-missile-silo-complex'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify planner integration and full footprint reservation
        run: |
          grep -F 'final int footprint = 6;' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmLayout.java
          grep -F 'new FarmMissileSilo(cx, cz, gy[a][c], this.seed, variant)' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmLayout.java
          grep -F 'FarmMissileSiloGeometry.paint' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSilo.java
          ! grep -nE '167|IRON_TRAPDOOR|GLOWSTONE' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'clearReservedInteriorVolumes();' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'reopenElevatorShaft();' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'paintConcealedSurfaceAccess();' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'WOOD_TRAPDOOR = 96' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'for (int y = low + 1; y <= this.h - 1; y++)' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          ! grep -nE 'paintPortalBlockhouseAndLockedLadder|westObservationBand|northWrapWindow' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'paintConnectedGalleryRail(level + 1);' src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java
          grep -F 'cfg.getInt(pathMountainKindPrefix + kind.key(), kind.defaultShare())' src/main/java/ch/k42/metropolis/plugin/PluginConfig.java
          grep -F 'this.summitHeight = 80 +' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'falloffStart = 0.16 + 0.62 * steepSide' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'outerCliff = 0.15 * smoothStep(0.77 + cliffWarp, 0.81 + cliffWarp, r)' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'double summitCore = 1.0 - smoothStep(0.025, 0.18, r)' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'LAKE_THRESHOLD = 60' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'this.cellSize = 192' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'return new FeatureCell(null,lake)' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'nearestLake(originX, originZ)' src/main/java/ch/k42/metropolis/commands/CommandMetropolisLake.java
          grep -F 'nearestMountain(originX, originZ)' src/main/java/ch/k42/metropolis/commands/CommandMetropolisMassif.java
          grep -F 'installCreeks(generator);' src/main/java/ch/k42/metropolis/grid/urbanGrid/UrbanGrid.java
          grep -F 'WildernessFeatures.install(seed);' src/main/java/ch/k42/metropolis/grid/urbanGrid/UrbanGrid.java
          grep -F 'WildernessFeatures.prepareForTile(seed, this.root.X, this.root.Y);' src/main/java/ch/k42/metropolis/grid/urbanGrid/UrbanGrid.java
          ! grep -R -nE 'MountainKind\.VOLCANO|case VOLCANO|VOLCANO[[:space:]]*\(' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild src/main/java/ch/k42/metropolis/plugin/PluginConfig.java
          ! grep -Eq '^[[:space:]]+volcano:[[:space:]]*[1-9]' src/main/resources/config.yml
      - name: Verify Bloomlands rarity migration and cross-city creek berth wiring
        run: |
          grep -F 'bloomlands: 1' src/main/resources/config.yml
          grep -F 'configuredShare == 2' src/main/java/ch/k42/metropolis/plugin/PluginConfig.java
          grep -F 'creekOriginSpacingChunks: 120' src/main/resources/config.yml
          grep -F 'setCreekOriginSpacingChunks' src/main/java/ch/k42/metropolis/plugin/PluginConfig.java
          grep -F 'isSpacingWinner(x, z, choice)' src/main/java/ch/k42/metropolis/grid/urbanGrid/river/BoundedRiverSites.java
          grep -F 'candidate(otherTileX, otherTileZ)' src/main/java/ch/k42/metropolis/grid/urbanGrid/river/BoundedRiverSites.java
      - name: Run Mother Willow geometry/painter audit and export exact Minecraft block preview
        run: |
          mkdir -p qa-out QA/R14_43/previews
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/MotherWillowGeometry.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/MotherWillowBlockState.java \
            QA/R14_40/MotherWillowBlockPainterProbe.java \
            QA/R14_43/MotherWillowVoxelPreview.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.forest.MotherWillowBlockPainterProbe
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.forest.MotherWillowVoxelPreview qa-out/mother-willow-preview.csv
          python3 QA/R14_43/export_mother_willow_schematic.py qa-out/mother-willow-preview.csv QA/R14_43/previews/MotherWillow_R14_43_Preview.schem
      - name: Run deterministic creek-origin spacing policy audits
        run: |
          mkdir -p qa-out
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/river/CreekCityOriginPolicy.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/river/CreekOriginSpacingPolicy.java \
            QA/R14_43/CreekOriginSpacingPolicyProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.river.CreekOriginSpacingPolicyProbe
      - name: Run deterministic geometry, variant, access and chunk-clipping audits
        run: |
          mkdir -p qa-out
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmRandom.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/farm/FarmMissileSiloGeometry.java \
            QA/R14_42/MissileSiloGeometryProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.farm.MissileSiloGeometryProbe
      - name: Verify landmark planner has bounded non-recursive neighbor proposals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/main/java/ch/k42/metropolis/grid/urbanGrid/districts/LandmarkPlans.java").read_text()
          def method_body(signature):
              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:index]
              raise AssertionError("Unclosed method: " + signature)
          accepted = method_body("public synchronized WorldLayout.Landmark siteOf(")
          raw = method_body("private WorldLayout.Landmark rawSiteOf(")
          lower = method_body("private List<WorldLayout.Landmark> lowerSites(")
          groups = method_body("private Set<String> groupsNearby(")
          assert "this.make(cellX, cellZ, site, true)" in accepted
          assert "this.make(cellX, cellZ, site, false)" in raw
          assert "this.siteOf(" not in lower and "this.siteOf(" not in groups
          assert "this.rawSiteOf(" in lower and "this.rawSiteOf(" in groups
          assert "enforceNeighbourRules ? this.groupsNearby" in source
          assert "enforceNeighbourRules ? this.lowerSites" in source
          print("LandmarkNonRecursiveProbe PASS: accepted plans use memoized, one-hop raw neighbor proposals; no recursive siteOf edge")
          PY
      - name: Probe deterministic natural stream meandering
        run: |
          mkdir -p qa-out
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/Noise2D.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/StreamMeanderGuide.java \
            QA/R14_49/StreamMeanderGuideProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.wild.StreamMeanderGuideProbe
      - name: Probe convergence-key identity, spatial lookup and LRU eviction
        run: |
          mkdir -p qa-out
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/HydrologyConvergenceKey.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/HydrologyConvergenceRegistry.java \
            QA/R14_48/HydrologyConvergenceRegistryProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.wild.HydrologyConvergenceRegistryProbe
      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Verify named massif, lake and continuous stream plan/ownership
        run: |
          sh QA/R14_33/run_wilderness_landmarks_probe.sh
          mkdir -p qa-out
          mvn -B -ntp -q dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile=qa-out/classpath
          CP="target/classes:$(cat qa-out/classpath)"
          javac -cp "$CP" -d qa-out QA/R14_43/LakeStreamCoverageProbe.java
          java -Xmx1536m -cp "qa-out:$CP" ch.k42.metropolis.grid.urbanGrid.wild.LakeStreamCoverageProbe
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/Noise2D.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/MountainKind.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildRelief.java \
            QA/R14_43/MountainKindNoVolcanoProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.wild.MountainKindNoVolcanoProbe
      - name: Verify keyed city-aware hydrology convergence
        run: |
          grep -F 'HydrologyConvergenceKey.Receiver.OCEAN' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'HydrologyConvergenceKey.Receiver.RIVER' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'HydrologyConvergenceKey.Receiver.CREEK' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessFeatures.java
          grep -F 'convergenceEndpointsIn' src/main/java/ch/k42/metropolis/grid/urbanGrid/river/BoundedRiverSites.java
          grep -F 'prepareForConvergenceArea' src/main/java/ch/k42/metropolis/grid/urbanGrid/UrbanGrid.java
          grep -F 'this.convergenceKey=convergenceKey' src/main/java/ch/k42/metropolis/grid/urbanGrid/wild/WildernessStreamCourse.java
      - name: Verify live legacy block conversion paths
        run: |
          grep -F 'Bukkit.getUnsafe().fromLegacy' src/main/java/ch/k42/metropolis/minions/LegacyBlocks.java
          grep -F 'LegacyMapper.getInstance().getBlockFromLegacy' src/main/java/ch/k42/metropolis/minions/LegacyBlocks.java
          grep -F 'result.getMaterial().isAir()' src/main/java/ch/k42/metropolis/minions/LegacyBlocks.java
      - name: Verify BiomeEcology startup and world-seed coherence
        run: |
          mkdir -p qa-out
          CP="target/classes:$(cat qa-out/classpath)"
          javac -cp "$CP" -d qa-out QA/R14_44/BiomeEcologySeedProbe.java
          java -cp "qa-out:$CP" ch.k42.metropolis.grid.urbanGrid.forest.BiomeEcologySeedProbe
          ! grep -Fq 'getDeclaredField("coneSeed")' src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/BiomeEcology.java
      - name: Verify embedded plugin version
        run: |
          expected='0.1.25-R14.49-Hydrology-Networks-DEV'
          actual="$(unzip -p target/Metropolis_R14_49_Hydrology_Networks_DEV.jar plugin.yml | sed -n 's/^version: //p')"
          test "$actual" = "$expected"
          echo "Embedded plugin version: $actual"
      - name: Assemble test delivery
        run: |
          mkdir -p delivery
          cp target/Metropolis_R14_49_Hydrology_Networks_DEV.jar delivery/
          zip -qr delivery/Metropolis_R14_49_FullSource.zip pom.xml src QA README_*.md DESIGN_R14_42_MISSILE_SILO_COMPLEX.md .github .gitattributes .gitignore
          (cd delivery && sha256sum *.jar *.zip > SHA256SUMS.txt)
          ls -lh delivery
      - name: Upload JAR and full source
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_49_Terrain_Hydrology
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
