name: R14.19 Chunky recovery build

on:
  push:
    branches:
      - fix/r14-19-chunky-recovery-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Chunky recovery policy regression probe
        run: |
          mkdir -p qa-classes
          javac --release 25 -d qa-classes \
            src/main/java/ch/k42/metropolis/generator/ChunkyBackpressurePolicy.java \
            QA/R14_19/ChunkyBackpressurePolicyProbe.java
          java -cp qa-classes ch.k42.metropolis.generator.ChunkyBackpressurePolicyProbe

      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Assemble versioned test delivery
        run: |
          mkdir -p delivery
          cp target/Metropolis_R14_19_Chunky_Recovery_Backoff_DEV.jar delivery/
          zip -qr delivery/Metropolis_R14_19_FullSource.zip \
            pom.xml src QA README_*.md compile_summary.txt .gitattributes .gitignore
          (cd delivery && sha256sum *.jar *.zip > SHA256SUMS.txt)
          ls -lh delivery

      - name: Upload JAR and full source
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_19_Chunky_Recovery_Backoff
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
