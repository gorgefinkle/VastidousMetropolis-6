name: R14.40 Mother Willow Block Painter

on:
  push:
    branches:
      - fix/r14-40-mother-willow-wood-placement
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/r14-40-mother-willow-wood-placement' || github.ref_name == 'fix/r14-40-mother-willow-wood-placement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Mother Willow geometry-to-painter regression
        run: |
          mkdir -p qa-out
          javac -d qa-out \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/MotherWillowGeometry.java \
            src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/MotherWillowBlockState.java \
            QA/R14_40/MotherWillowBlockPainterProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.forest.MotherWillowBlockPainterProbe
      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Verify embedded plugin version
        run: |
          expected='0.1.16-R14.40-Mother-Willow-Block-Painter-DEV'
          actual="$(unzip -p target/Metropolis_R14_40_Mother_Willow_Block_Painter_DEV.jar plugin.yml | sed -n 's/^version: //p')"
          test "$actual" = "$expected"
          echo "Embedded plugin version: $actual"
      - name: Assemble test delivery
        run: |
          mkdir -p delivery
          cp target/Metropolis_R14_40_Mother_Willow_Block_Painter_DEV.jar delivery/
          zip -qr delivery/Metropolis_R14_40_FullSource.zip pom.xml src QA README_*.md .github .gitattributes .gitignore
          (cd delivery && sha256sum *.jar *.zip > SHA256SUMS.txt)
          ls -lh delivery
      - name: Upload JAR and full source
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_40_Mother_Willow_Block_Painter
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
