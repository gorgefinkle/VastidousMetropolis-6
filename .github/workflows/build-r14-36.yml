name: R14.36 Mother Willow structure

on:
  push:
    branches:
      - fix/r14-36-mother-willow-structure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/r14-36-mother-willow-structure' || github.ref_name == 'fix/r14-36-mother-willow-structure'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Mother Willow geometry regression
        run: |
          mkdir -p qa-out
          javac -d qa-out src/main/java/ch/k42/metropolis/grid/urbanGrid/forest/MotherWillowGeometry.java QA/R14_36/MotherWillowGeometryProbe.java
          java -cp qa-out ch.k42.metropolis.grid.urbanGrid.forest.MotherWillowGeometryProbe
      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Verify embedded plugin version
        run: |
          expected='0.1.12-R14.36-Mother-Willow-Structure-DEV'
          actual="$(unzip -p target/Metropolis_R14_36_Mother_Willow_Structure_DEV.jar plugin.yml | sed -n 's/^version: //p')"
          test "$actual" = "$expected"
          echo "Embedded plugin version: $actual"
      - name: Assemble test delivery
        run: |
          mkdir -p delivery
          cp target/Metropolis_R14_36_Mother_Willow_Structure_DEV.jar delivery/
          zip -qr delivery/Metropolis_R14_36_FullSource.zip pom.xml src QA README_*.md .github .gitattributes .gitignore
          (cd delivery && sha256sum *.jar *.zip > SHA256SUMS.txt)
          ls -lh delivery
      - name: Upload JAR and full source
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_36_Mother_Willow_Structure
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
