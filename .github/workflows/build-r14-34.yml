name: R14.34 Chunky recovery build on R14.33

on:
  push:
    branches:
      - fix/r14-34-chunky-recovery-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/r14-34-chunky-recovery-gate' || github.ref_name == 'fix/r14-34-chunky-recovery-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run R14.34 Chunky recovery regression probe
        run: bash QA/R14_34/run_chunky_backpressure_policy_probe.sh

      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify embedded plugin version
        run: |
          expected='0.1.10-R14.34-Chunky-Recovery-Backoff-DEV'
          actual="$(unzip -p target/Metropolis_R14_34_Chunky_Recovery_Backoff_DEV.jar plugin.yml | sed -n 's/^version: //p')"
          test "$actual" = "$expected"
          echo "Embedded plugin version: $actual"

      - name: Assemble complete test delivery
        run: |
          mkdir -p delivery
          cp target/Metropolis_R14_34_Chunky_Recovery_Backoff_DEV.jar delivery/
          zip -qr delivery/Metropolis_R14_34_FullSource.zip \
            pom.xml src QA README_*.md .gitattributes .gitignore
          (cd delivery && sha256sum *.jar *.zip > SHA256SUMS.txt)
          ls -lh delivery

      - name: Upload JAR and full source
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_34_Chunky_Recovery_Backoff
          path: delivery/*
          if-no-files-found: error
          retention-days: 14
