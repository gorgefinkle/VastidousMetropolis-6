name: R14.8 Morphomos, rare biomes and BUILD export verification

on:
  push:
    branches:
      - integration/morphomos-natural-family-bloomlands
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven clean verify
        run: mvn -B -ntp clean verify
      - name: Morphomos boundary-family probe
        run: sh QA/R14_8/run_boundary_family_probe.sh
      - name: Rare-biome appearance probe
        run: sh QA/R14_8/run_wild_biome_appearance_probe.sh
      - name: BUILD export durability probe
        run: sh QA/R14_8/run_build_flag_exporter_probe.sh
      - name: Assemble complete source archive
        run: |
          zip -r Metropolis_R14_8_Morphomos_Bloomlands_BuildExport_SOURCE.zip \
            .gitattributes .gitignore .github pom.xml compile_summary.txt \
            README*.md QA src
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis_R14_8_Morphomos_Bloomlands_BuildExport_DEV
          if-no-files-found: error
          path: |
            target/Metropolis_R14_8_Morphomos_Bloomlands_BuildExport_DEV.jar
            Metropolis_R14_8_Morphomos_Bloomlands_BuildExport_SOURCE.zip
