name: R14.18 source patch staging
on:
  push:
    branches:
      - feature/r14-18-branch-growth-throughput
permissions:
  contents: write
jobs:
  apply-r14-18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/r14-18-branch-growth-throughput
      - name: Apply complete R14.18 source patch
        if: ${{ hashFiles('.github/r14-18.patch.part00') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r14-18.patch.part* > "$RUNNER_TEMP/r14-18.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/r14-18.patch.xz.b64" | xz --decompress --stdout > "$RUNNER_TEMP/r14-18.patch"
          git apply --check "$RUNNER_TEMP/r14-18.patch"
          git apply "$RUNNER_TEMP/r14-18.patch"
          rm -f .github/r14-18.patch.part* .github/r14-18.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R14.18: remove growth queue throttles and enclose Karstlands"
          git push origin HEAD:refs/heads/feature/r14-18-branch-growth-throughput
